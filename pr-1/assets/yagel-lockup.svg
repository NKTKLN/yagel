<svg xmlns="http://www.w3.org/2000/svg" width="150" height="40" viewBox="0 0 150 40"
     role="img" aria-label="Ягель — логоблок: знак ростка и надпись ЯГЕЛЬ">
  <title>Ягель — основной логоблок</title>
  <!-- Комбинированное обозначение: плашка 40x40 (r=8) со знаком 28x28 + слово ЯГЕЛЬ.
       Отступ знака от края плашки 6, зазор плашка–слово 10.
       Надпись: Golos Text 800, кегль 20, трекинг +0.14em.
       Требует установленного шрифта Golos Text; иначе подставится системный гротеск. -->
  <rect width="40" height="40" rx="8" fill="#14181A"/>
  <g fill="#EBE9E2" shape-rendering="crispEdges" transform="translate(6 6) scale(1.75)">
    <rect x="10" y="2" width="4" height="1"/>
    <rect x="2" y="3" width="3" height="1"/>
    <rect x="9" y="3" width="5" height="1"/>
    <rect x="2" y="4" width="5" height="1"/>
    <rect x="8" y="4" width="6" height="1"/>
    <rect x="2" y="5" width="6" height="1"/>
    <rect x="9" y="5" width="5" height="1"/>
    <rect x="2" y="6" width="6" height="1"/>
    <rect x="10" y="6" width="3" height="1"/>
    <rect x="3" y="7" width="6" height="1"/>
    <rect x="10" y="7" width="1" height="1"/>
    <rect x="4" y="8" width="5" height="1"/>
    <rect x="6" y="9" width="3" height="1"/>
    <rect x="7" y="10" width="2" height="1"/>
    <rect x="7" y="11" width="2" height="1"/>
    <rect x="7" y="12" width="2" height="1"/>
    <rect x="7" y="13" width="2" height="1"/>
  </g>
  <text x="50" y="27" fill="#14181A"
        font-family="'Golos Text','Golos UI','Inter','Helvetica Neue',Arial,sans-serif"
        font-weight="800" font-size="20" letter-spacing="2.8">ЯГЕЛЬ</text>
</svg>
